<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe test host</title>
  </head>
  <body style="margin: 0; min-height: 1800px">
    <div style="height: 200px">Parent content</div>
    <iframe
      id="app-frame"
      title="KTH spaces"
      src="/"
      style="display: block; width: 1200px; height: 600px; border: 0"
    ></iframe>
    <script>
      if (new URLSearchParams(window.location.search).has("mobile")) {
        document.querySelector("#app-frame").style.width = "390px";
      }
    </script>
  </body>
</html>
